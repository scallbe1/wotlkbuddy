name: Code quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  function-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent growth of oversized production functions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/code_quality.py --base "$BASE_SHA"
