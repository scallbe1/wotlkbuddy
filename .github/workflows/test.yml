name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m wotlkbuddy simulate --ticks 10

  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Parse WoW 3.3.5a addon with Lua 5.1
        run: luac5.1 -p addons/WotLKBuddyTelemetry/WotLKBuddyTelemetry.lua
      - name: Exercise legacy 3.3.5a spellbook ID resolution
        run: lua5.1 tests/lua_spellbook_v053.lua
      - name: Verify actual actionbar observation and duplicate slot preservation
        run: lua5.1 tests/lua_actionbar_v054.lua
      - name: Audit raw actionbar page 2 without touching WoW client state
        run: lua5.1 tests/lua_actionbar_pages_v055.lua
      - name: Audit action spell ID vs spellbook index with actual legacy Lua APIs
        run: lua5.1 tests/lua_action_identity_v056.lua
      - name: Resolve verified action spells and Fireball key on actual 3.3.5a semantics
        run: lua5.1 tests/lua_verified_action_spells_v057.lua
      - name: Show sourced Detour destinations in the native goal/action HUD
        run: lua5.1 tests/lua_native_hud_travel_v060.lua
