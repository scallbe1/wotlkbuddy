[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wotlkbuddy"
version = "0.61.0"
description = "Python-first WotLK 3.3.5a experimental automation framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "WotLKBuddy contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Development Status :: 2 - Pre-Alpha",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
live = ["mss>=9", "colorama>=0.4.6; platform_system == 'Windows'"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wotlkbuddy = "wotlkbuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wotlkbuddy.horde" = ["verified_vendor_services.tsv", "QuestMetadata.upstream.tsv", "QuestRelations.upstream.tsv", "QuestObjectives.upstream.tsv", "QuestLoot.upstream.json", "QuestScripts.upstream.json"]
"wotlkbuddy.profiles" = ["Horde/Starter/*.xml", "Horde/Classic/*.xml", "Alliance/Starter/*.xml", "Alliance/Classic/*.xml", "schema/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
